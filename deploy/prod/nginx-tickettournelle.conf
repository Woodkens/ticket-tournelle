# Ticket'Tournelle — Nginx, serveur de PRODUCTION (Debian 13 du lycée).
# MODÈLE : ce fichier n'est installé nulle part par le poste de développement.
# À compléter pendant l'installation du serveur : __SERVER_NAME__, __PROJECT__ et les chemins du certificat (H7).

# Port 80 : redirection permanente vers HTTPS (ENF-29)
server {
    listen 80;
    server_name __SERVER_NAME__;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/ssl/certs/tickettournelle.crt;
    ssl_certificate_key /etc/ssl/private/tickettournelle.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- En-têtes de sécurité (ENF-29), envoyés sur toutes les réponses ---
    # HSTS : pendant un an, le navigateur refuse de revenir en HTTP sur ce site.
    # Uniquement en production : en développement, il bloquerait « localhost » pour les autres projets.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Interdit d'afficher le site dans un cadre d'un autre site (clickjacking)
    add_header X-Frame-Options "DENY" always;
    # Le navigateur ne devine pas le type des fichiers (une image reste une image)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Content-Security-Policy : ajoutée en S8, après l'inventaire des scripts et des styles.

    root __PROJECT__/public;

    server_tokens off;
    client_max_body_size 6m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-tickettournelle.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
