# Ticket'Tournelle — Nginx, poste de DÉVELOPPEMENT (WSL2 / Debian 13).
# Installé par : sudo deploy/dev/install-web.sh  (voir README, section B).
# Le modèle pour le serveur (avec HSTS) est dans deploy/prod/.

# Port 80 (HTTP) : rien n'est servi en clair, tout est redirigé vers HTTPS (ENF-29)
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# Port 443 (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Certificat auto-signé du poste, créé par deploy/dev/make-cert.sh.
    # Il est rangé dans /etc/ssl, HORS du dépôt Git : la clé privée est un secret (ENF-11).
    ssl_certificate     /etc/ssl/certs/tickettournelle-dev.crt;
    ssl_certificate_key /etc/ssl/private/tickettournelle-dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;    # les anciennes versions (SSLv3, TLS 1.0/1.1) sont cassées

    # PAS de HSTS en développement : le navigateur retiendrait « localhost = HTTPS obligatoire »
    # pour tous les autres projets du poste. HSTS est dans la configuration de production.

    # Seul public/ est exposé : src/, config/, .env.local restent hors de la racine web
    root __PROJECT__/public;

    server_tokens off;            # ne pas afficher la version de Nginx (R1 §2)
    client_max_body_size 6m;      # pièces jointes 5 Mo max (ENF-30) + marge du formulaire

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Seul le contrôleur frontal index.php est exécuté par PHP
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-tickettournelle.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;   # transmet aussi HTTPS=on : Symfony sait que la requête est chiffrée
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Tout autre fichier .php (ex. webshell déposé) : jamais exécuté (scénario R1 §3.4)
    location ~ \.php$ {
        return 404;
    }

    # Fichiers cachés (.env, .git…) : jamais servis
    location ~ /\. {
        deny all;
    }
}
