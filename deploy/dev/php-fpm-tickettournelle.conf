; Ticket'Tournelle — pool PHP-FPM du poste de DÉVELOPPEMENT.
; En développement, PHP s'exécute sous le compte du développeur (propriétaire du projet).
; En production (S5), un compte système dédié sans shell le remplacera.
[tickettournelle]
user = __USER__
group = __USER__

listen = /run/php/php8.4-fpm-tickettournelle.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s

; Limites alignées sur les pièces jointes (ENF-30)
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 6M
