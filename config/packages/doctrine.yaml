doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # À chaque connexion, MariaDB passe en temps universel (UTC), comme PHP (D-26) : NOW(), les dates
        # posées par MariaDB (journal_audit) et celles écrites par PHP parlent ainsi de la même heure.
        # 1002 est le numéro de l'option PDO « commande exécutée à l'ouverture de la connexion ».
        options:
            1002: "SET time_zone = '+00:00'"

        # Doctrine ne compare que les tables déjà décrites par une entité (D-06).
        # Liste à compléter à chaque séance, jusqu'à couvrir les 10 tables du MPD.
        # Sans ce filtre, doctrine:schema:validate proposerait de SUPPRIMER les tables sans entité.
        schema_filter: '~^(utilisateur|journal_audit|jeton_compte|code_secours)$~'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
