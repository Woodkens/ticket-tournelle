security:
    # Argon2id explicite (ENF-01, D-08) : « auto » choisit bcrypt sur Symfony 7.4.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id

    # Les comptes sont lus dans la table `utilisateur`, l'identifiant est l'adresse e-mail (C1).
    providers:
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Message d'erreur générique (ENF-03) : Symfony ne dit jamais si le compte existe,
    # s'il est désactivé, pas encore activé, ou si seul le mot de passe est faux.
    expose_security_errors: none

    # Nouvel identifiant de session à chaque connexion (ENF-07, contre la fixation de session).
    session_fixation_strategy: migrate

    # Aucune hiérarchie de rôles (D-09) : dans la matrice du CdC §2.1, aucun rôle
    # ne contient entièrement les droits d'un autre. Les Voters appliquent la matrice.

    firewalls:
        dev:
            # Outils de développement et fichiers statiques : hors du pare-feu
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: utilisateurs
            # Refuse les comptes désactivés ou pas encore activés
            user_checker: App\Security\UtilisateurChecker

            form_login:
                login_path: app_login
                check_path: app_login
                # Jeton CSRF lié à la session, vérifié avant le mot de passe (D-10)
                enable_csrf: true
                # Après connexion : la page demandée au départ, sinon l'accueil
                default_target_path: app_root

            # ENF-03 : 5 essais par couple e-mail + adresse IP sur 15 minutes
            # (et 25 par adresse IP seule) ; au-delà, connexion bloquée jusqu'à la fin des 15 minutes (D-11).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Déconnexion en POST avec jeton CSRF ; la session est détruite côté serveur (ENF-09).
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                invalidate_session: true

            # Double authentification TOTP des administrateurs (ENF-05, C5, D-21) : après le mot de passe,
            # scheb/2fa-bundle garde le compte « en attente » et n'accorde aucun rôle tant que le code
            # n'est pas validé. Pas de « se souvenir de moi », pas d'appareil de confiance.
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true
                default_target_path: app_root

    # Protégé par défaut : tout exige d'être connecté, sauf les pages listées ici.
    # Seule la PREMIÈRE règle qui correspond est appliquée.
    access_control:
        - { path: '^/(login|(fr|en)/login)$', roles: PUBLIC_ACCESS }
        # Activation, réinitialisation, mot de passe oublié : on n'est pas encore connecté
        - { path: '^/(fr|en)/(mot-de-passe-oublie|compte/mot-de-passe/)', roles: PUBLIC_ACCESS }
        # La déconnexion reste possible pendant la saisie du code TOTP (elle exige toujours POST + CSRF)
        - { path: '^/logout$', roles: PUBLIC_ACCESS }
        # Saisie du code : réservée à un compte dont le mot de passe vient d'être vérifié
        - { path: '^/2fa', roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        # Administration : rôle admin, accordé seulement une fois la 2FA validée
        - { path: '^/(fr|en)/admin', roles: ROLE_ADMIN }
        - { path: '^/', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # En test, on réduit le coût d'Argon2id pour que les tests restent rapides.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3 # valeur minimale
                memory_cost: 10 # valeur minimale
