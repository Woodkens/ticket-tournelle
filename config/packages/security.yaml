security:
    # Argon2id explicite (ENF-01, D-08) : « auto » choisit bcrypt sur Symfony 7.4.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id

    # Les comptes sont lus dans la table `utilisateur`, l'identifiant est l'adresse e-mail (C1).
    providers:
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Message d'erreur générique (ENF-03) : Symfony ne dit jamais si le compte existe,
    # s'il est désactivé ou si seul le mot de passe est faux.
    expose_security_errors: none

    # Nouvel identifiant de session à chaque connexion (ENF-07, contre la fixation de session).
    session_fixation_strategy: migrate

    # Aucune hiérarchie de rôles (D-09) : dans la matrice du CdC §2.1, aucun rôle
    # ne contient entièrement les droits d'un autre. Les Voters appliqueront la matrice (S6/S7).

    firewalls:
        dev:
            # Outils de développement et fichiers statiques : hors du pare-feu
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: utilisateurs
            # Refuse les comptes désactivés (actif = false)
            user_checker: App\Security\UtilisateurChecker

            form_login:
                login_path: app_login
                check_path: app_login
                # Jeton CSRF lié à la session, vérifié avant le mot de passe (D-10)
                enable_csrf: true
                # Après connexion : la page demandée au départ, sinon l'accueil
                default_target_path: app_root

            # ENF-03 : 5 essais par couple e-mail + adresse IP sur 15 minutes
            # (et 25 par adresse IP seule) ; au-delà, connexion bloquée jusqu'à la fin des 15 minutes (D-11).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            # Déconnexion en POST avec jeton CSRF ; la session est détruite côté serveur (ENF-09).
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                invalidate_session: true

            # Point d'extension S6 (D-07) : la 2FA TOTP des administrateurs (scheb/2fa-bundle)
            # se déclarera ici, avec la clé « two_factor ».

    # Protégé par défaut : tout exige d'être connecté, sauf l'écran de connexion.
    # Seule la PREMIÈRE règle qui correspond est appliquée.
    access_control:
        - { path: '^/(login|(fr|en)/login)$', roles: PUBLIC_ACCESS }
        - { path: '^/', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # En test, on réduit le coût d'Argon2id pour que les tests restent rapides.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3 # valeur minimale
                memory_cost: 10 # valeur minimale
